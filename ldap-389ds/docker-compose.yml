---
networks:
  ldap:

services:
  ldap:
    build: ./389ds
    networks:
      ldap:
    ports:
      - "389:389"

  phpldapadmin:
    image: phpldapadmin/phpldapadmin:2.3.12
    environment:
      LDAP_HOST: ldap
      LDAP_LOGIN_ATTR: dn
      LDAP_LOGIN_ATTR_DESC: DN
      LDAP_LOGIN_OBJECTCLASS: simpleSecurityObject
    networks:
      ldap:
    ports:
      - "14080:8080"

  self-service-password:
    image: ltbproject/self-service-password:1.8.2
    platform: linux/amd64
    volumes:
      - ./self-service-password/config.inc.local.php:/var/www/conf/config.inc.local.php:ro
    networks:
      ldap:
    ports:
      - "14081:80"
